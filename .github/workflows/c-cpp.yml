name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Perft
        run: make perft

  esp32s3:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build for ESP32-S3
        run: pio run -e esp32s3

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with make
        run: make

      - name: Run tests
        run: make test
        shell: cmd

      - name: Perft
        run: make perft
        shell: cmd

      - name: Clean
        run: make clean
