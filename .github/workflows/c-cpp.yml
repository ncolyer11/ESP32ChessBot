name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Perft
        run: make perft

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with make
        run: make

      - name: Run tests
        run: make test
        shell: cmd

      - name: Perft
        run: make perft
        shell: cmd

      - name: Clean
        run: make clean
