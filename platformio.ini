[platformio]
; the esp32 entry point lives in esp32/, the engine sources are pulled in by esp32/CMakeLists.txt
src_dir = esp32

; ESP32-S3 build: `pio run -e esp32s3` (add `-t upload -t monitor` to flash and open the console)
[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf

build_flags = -O2
build_unflags = -Os
board_build.flash_size = 8MB
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; direct keeps the ANSI colours of the board
monitor_filters = direct
